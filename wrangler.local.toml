# Local development only: `wrangler pages dev dist -c wrangler.local.toml` gives the Functions a local D1 so shared trips can be
# exercised without a Cloudflare database. Production bindings live in wrangler.toml.
name = "seoul-pocket"
compatibility_date = "2026-09-07"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "seoul-pocket"
database_id = "local-only"
migrations_dir = "migrations"
